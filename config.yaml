# Cortex Configuration
# Copy this file to config.yaml and customize as needed
#
# Precedence (ADR-0019): OS environment > this file > .env > defaults.
# The compose Postgres publishes POSTGRES_HOST_PORT (default 5433) — keep the
# url below in sync when you change it.

database:
  url: "postgresql://cortex:cortex@localhost:5433/cortex"
  pool_min_size: 5
  pool_max_size: 20
  pool_timeout: 30

llm:
  provider: "openai"  # DeepSeek is OpenAI-compatible
  api_key: "${LLM_API_KEY}"  # Set via environment variable (.env)
  base_url: "https://api.deepseek.com"
  model: "deepseek-v4-flash"
  timeout: 60

trace:
  # Local rizzo-pii instance used to pseudonymize captured traces
  # (docker compose --profile trace)
  sidecar_url: "http://127.0.0.1:5005"
  sidecar_timeout_s: 10.0
  # Loop events older than this many days are deleted by `cortex traces:cleanup`
  retention_days: 30

mqtt:
  broker_url: "mqtt://localhost:1883"
  keepalive: 60
  reconnect_interval: 5

app:
  host: "0.0.0.0"
  port: 8000
  reload: false
  workers: 1

logging:
  level: "INFO"
  format: "console"
  include_trace_id: true

learning:
  # ESN reservoir hyperparameters (ADR-0001)
  reservoir_size: 500
  spectral_radius: 0.9
  input_scale: 1.0
  leak_rate: 0.3
  ridge_lambda: 0.000001

tools:
  # Deny-by-default meta-tool allow-list (#134): only these names are
  # advertised to the model. Left unset, the code default
  # (`DEFAULT_ALLOWED_TOOLS`) applies; `TOOLS_ALLOW` overrides both.
  # `shell` and `file_write` are opt-in until #120 owns path/argument policy
  # and per-call approval.
  #  allow:
  #    - file_read
  #    - grep
  #    - ask_user

safety:
  # Backups (and, in #147/#148, snapshots and the journal) live outside the
  # repo and every Docker volume (ADR-0021). `~` expands to the user's home.
  store_dir: "~/.local/share/cortex"
  # Newest N backups kept; 0 disables pruning.
  backup_retention: 14
  # Take a dump before applying pending migrations. If the dump fails, startup
  # aborts unless require_backup_before_migration is false.
  backup_on_migration: true
  require_backup_before_migration: true
  # Snapshot an existing file before file_write overwrites it (default on).
  # `cortex undo last` restores it. Disabling is explicit.
  snapshot_enabled: true

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme>=22.5.0"]
build-backend = "hatchling.build"

[project]
name = "cortex"
version = "0.1.0"
description = "Cortex - Personal AI Assistant"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "S. Bottiglieri" }]
dependencies = [
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "asyncpg>=0.29",
  "openai>=1.0",
  "aiomqtt>=2.0",
  "pyyaml>=6.0",
  "structlog>=24.0",
  "tenacity>=8.0",
  "uvicorn>=0.30",
  "fastapi>=0.115",
  "httpx>=0.27",
  "typer>=0.15",
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3.0",
  "numpy>=2.5.2",
  "pydatalog>=0.22.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.0",
  "ruff>=0.3",
  "mypy>=1.0",
  "pre-commit>=3.0",
]

[project.scripts]
cortex = "cortex.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

# asyncpg ships no stubs (no py.typed); nothing to annotate on our side.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

# pyDatalog ships no type hints; its public API is untyped.
[[tool.mypy.overrides]]
module = ["pyDatalog", "pyDatalog.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "import-linter>=2.6",
    "types-colorama>=0.4.15.20260508",
    "types-pyyaml>=6.0.12.20260724",
]

[tool.importlinter]
root_package = "cortex"

# A TYPE_CHECKING import is not a runtime edge: it cannot break a boundary and
# cannot invent a cycle. This is a session option, so it applies to every contract.
exclude_type_checking_imports = true

# The fitness function for module boundaries (#167): the order is enforced, and a
# contract that needs `ignore_imports` means the design debt is back. Why: ADR-0022.

[[tool.importlinter.contracts]]
name = "layers: the enforced order"
type = "layers"
layers = [
    # `|` = independent siblings, `:` = same-group imports are allowed (and
    # acyclic_siblings forbids a cycle among them).
    "cortex.main | cortex.cli",
    "cortex.api : cortex.execution : cortex.interaction",
    "cortex.eval : cortex.trace",
    "cortex.agentic",
    "cortex.services",
    "cortex.sessions : cortex.memory : cortex.validation : cortex.goals : cortex.minions : cortex.rules : cortex.learning",
    "cortex.events : cortex.llm : cortex.tools : cortex.db",
    "cortex.config : cortex.logging : cortex.safety",
    "cortex.shared",
]

[[tool.importlinter.contracts]]
name = "acyclic_siblings: no cycle between two modules"
type = "acyclic_siblings"
ancestors = ["cortex"]
depth = 1

[[tool.importlinter.contracts]]
name = "rules: the repository is private to the rules module"
type = "protected"
protected_modules = ["cortex.rules.repository"]
allowed_importers = ["cortex.rules", "cortex.main", "cortex.cli"]

[[tool.importlinter.contracts]]
name = "rules: the score is private to the rules module"
type = "protected"
protected_modules = ["cortex.rules.scoring"]
allowed_importers = ["cortex.rules"]

# The door is the package `__init__.py`: a module is entered through it, or through
# the open `interfaces`/`models`, never through an implementation submodule (#191,
# Law 2). One contract per module, never one wildcard contract: `cortex.*` would
# match every importer and defeat the check. Only the module itself, `cortex.main`
# and `cortex.cli` (the composition root) may name an implementation.

[[tool.importlinter.contracts]]
name = "memory internals are private to memory"
type = "protected"
protected_modules = [
    "cortex.memory.context_provider",
    "cortex.memory.fact_store",
    "cortex.memory.fact_extractor",
    "cortex.memory.conversation_extractor",
    "cortex.memory.evidence_store",
    "cortex.memory.repository",
    "cortex.memory.backfill",
]
allowed_importers = ["cortex.memory", "cortex.main", "cortex.cli"]

[[tool.importlinter.contracts]]
name = "rules internals are private to rules"
type = "protected"
protected_modules = [
    "cortex.rules.service",
    "cortex.rules.queue",
    "cortex.rules.render",
    "cortex.rules.scoring",
    "cortex.rules.repository",
    "cortex.rules.attribution",
    "cortex.rules.conflicts",
    "cortex.rules.feedback",
    "cortex.rules.splits",
    "cortex.rules.constants",
]
allowed_importers = ["cortex.rules", "cortex.main", "cortex.cli"]

[[tool.importlinter.contracts]]
name = "tools internals are private to tools"
type = "protected"
protected_modules = [
    "cortex.tools.executor",
    "cortex.tools.registry",
    "cortex.tools.meta",
]
allowed_importers = ["cortex.tools", "cortex.main", "cortex.cli"]

[[tool.importlinter.contracts]]
name = "goals internals are private to goals"
type = "protected"
protected_modules = ["cortex.goals.repository"]
allowed_importers = ["cortex.goals", "cortex.main", "cortex.cli"]

[[tool.importlinter.contracts]]
name = "trace internals are private to trace"
type = "protected"
protected_modules = [
    "cortex.trace.recorder",
    "cortex.trace.audit",
    "cortex.trace.repository",
    "cortex.trace.pseudonymizer",
]
allowed_importers = ["cortex.trace", "cortex.main", "cortex.cli"]

# Law 6: `shared` holds technical vocabulary and nothing else, so it imports no
# module at runtime. Its `Fact`/`Rule`/`UsageStats` annotations are type-only and
# already dropped by `exclude_type_checking_imports` above.

[[tool.importlinter.contracts]]
name = "shared kernel imports no module"
type = "forbidden"
source_modules = ["cortex.shared"]
forbidden_modules = [
    "cortex.agentic",
    "cortex.api",
    "cortex.cli",
    "cortex.config",
    "cortex.db",
    "cortex.eval",
    "cortex.events",
    "cortex.execution",
    "cortex.goals",
    "cortex.interaction",
    "cortex.learning",
    "cortex.llm",
    "cortex.logging",
    "cortex.main",
    "cortex.memory",
    "cortex.minions",
    "cortex.rules",
    "cortex.safety",
    "cortex.services",
    "cortex.sessions",
    "cortex.tools",
    "cortex.trace",
    "cortex.validation",
]

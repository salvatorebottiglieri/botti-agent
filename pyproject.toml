[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme>=22.5.0"]
build-backend = "hatchling.build"

[project]
name = "cortex"
version = "0.1.0"
description = "Cortex - Personal AI Assistant"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "S. Bottiglieri" }]
dependencies = [
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "asyncpg>=0.29",
  "openai>=1.0",
  "aiomqtt>=2.0",
  "pyyaml>=6.0",
  "structlog>=24.0",
  "tenacity>=8.0",
  "uvicorn>=0.30",
  "fastapi>=0.115",
  "httpx>=0.27",
  "typer>=0.15",
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3.0",
  "numpy>=2.5.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.0",
  "ruff>=0.3",
  "mypy>=1.0",
  "pre-commit>=3.0",
]

[project.scripts]
cortex = "cortex.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

# asyncpg ships no stubs (no py.typed); nothing to annotate on our side.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "types-colorama>=0.4.15.20260508",
    "types-pyyaml>=6.0.12.20260724",
]

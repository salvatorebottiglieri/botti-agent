# Mosquitto configuration for Cortex

# Listener for MQTT
listener 1883
protocol mqtt

# Allow anonymous for local development (minion auth handled at app level)
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db

# Message retention
max_queued_messages 1000
# Retained messages carrying a message-expiry property are purged on access;
# also sweep the retained tree periodically for expired messages.
retain_expiry_interval 1440

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Connection limits
max_connections -1
max_keepalive 65535

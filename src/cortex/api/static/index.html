<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cortex</title>
<style>
  :root {
    --bg: #0b0e13;
    --surface: #12161d;
    --border: #1f2530;
    --text: #e6e9ef;
    --muted: #8b93a3;
    --accent: #5eead4;
    --accent-dim: #123b36;
    --danger: #f87171;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .brand { font-weight: 650; letter-spacing: .02em; }
  .brand span { color: var(--accent); }
  .spacer { flex: 1; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #3a4254; }
  .dot.on { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .token {
    background: transparent; color: var(--muted); font-family: var(--mono); font-size: 12px;
    border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; width: 210px; outline: none;
  }
  .token:focus { border-color: #2c3547; color: var(--text); }
  button {
    background: transparent; color: var(--muted); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 12px; font-size: 13px; cursor: pointer; transition: color .15s, border-color .15s;
  }
  button:hover { color: var(--text); border-color: #2c3547; }
  button:disabled { opacity: .4; cursor: default; }
  #chat {
    flex: 1; overflow-y: auto; padding: 28px 20px;
    scroll-behavior: smooth;
  }
  .inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--accent-dim); color: #d9fbf3; border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.error { align-self: flex-start; background: rgba(248,113,113,.08); border: 1px solid rgba(248,113,113,.35); color: var(--danger); }
  .msg.assistant.streaming::after {
    content: "▍"; color: var(--accent); animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  /* --- Markdown elements inside assistant bubbles (issue #80) --- */
  .msg.assistant pre {
    max-width: 100%;
    overflow-x: auto;
    white-space: pre;
    background: rgba(0,0,0,.35);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.5;
    padding: 10px 12px;
    margin: 8px 0;
  }
  .msg.assistant code {
    font-family: var(--mono);
    font-size: .85em;
    background: rgba(94,234,212,.08);
    border-radius: 4px;
    padding: 1px 5px;
  }
  .msg.assistant pre code {
    background: transparent;
    padding: 0;
    border-radius: 0;
    font-size: inherit;
    white-space: pre;
  }
  .msg.assistant h1, .msg.assistant h2, .msg.assistant h3 {
    font-weight: 500;
    line-height: 1.3;
    margin: 14px 0 6px;
  }
  .msg.assistant h1 { font-size: 17px; }
  .msg.assistant h2 { font-size: 16px; }
  .msg.assistant h3 { font-size: 15px; }
  .msg.assistant h1:first-child, .msg.assistant h2:first-child, .msg.assistant h3:first-child { margin-top: 0; }
  .msg.assistant p { margin: 6px 0; }
  .msg.assistant p:last-child { margin-bottom: 0; }
  .msg.assistant ul, .msg.assistant ol { margin: 6px 0; padding-left: 22px; }
  .msg.assistant li { margin: 3px 0; }
  .msg.assistant blockquote {
    margin: 8px 0;
    padding: 2px 12px;
    border-left: 3px solid var(--accent);
    color: var(--muted);
  }
  .msg.assistant a {
    color: var(--accent);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .msg.assistant a:hover { color: #a5f3e6; }
  .thinking { align-self: flex-start; color: var(--muted); font-size: 13px; font-style: italic; display: flex; gap: 6px; align-items: center; }
  .thinking .tick { display: inline-flex; gap: 3px; }
  .thinking .tick i { width: 4px; height: 4px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite; }
  .thinking .tick i:nth-child(2) { animation-delay: .2s; } .thinking .tick i:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce { 0%,100% { opacity: .25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-2px); } }
  .tools { align-self: flex-start; display: flex; flex-wrap: wrap; gap: 6px; }
  .tool {
    font-size: 12px; font-family: var(--mono); color: var(--muted);
    border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px;
  }
  .tool.ok { color: var(--accent); border-color: rgba(94,234,212,.3); }
  .tool.fail { color: var(--danger); border-color: rgba(248,113,113,.3); }
  .tool { cursor: default; }
  .tool.expandable { cursor: pointer; border-radius: 8px; }
  .tool pre { display: none; white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 6px; background: rgba(0,0,0,.4); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 11px; line-height: 1.4; max-width: 520px; }
  .tool.expanded { border-radius: 8px; }
  .tool.expanded pre { display: block; }
  .options { align-self: flex-start; display: flex; flex-wrap: wrap; gap: 8px; max-width: 82%; }
  .option {
    font-size: 13px; color: var(--accent); background: var(--accent-dim);
    border: 1px solid rgba(94,234,212,.35); border-radius: 999px; padding: 6px 14px;
    cursor: pointer; transition: background .15s, color .15s;
  }
  .option:hover { background: #17483f; color: #d9fbf3; }
  .think-toggle { align-self: flex-start; background: none; border: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: 0; display: flex; align-items: center; gap: 4px; }
  .think-toggle:hover { color: var(--text); }
  .think-block { display: none; align-self: flex-start; max-width: 82%; background: rgba(255,255,255,.02); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 12px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; font-style: italic; line-height: 1.5; }
  .think-block.visible { display: block; }
  footer { border-top: 1px solid var(--border); background: var(--surface); padding: 12px 20px 16px; }
  .bar { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; background: var(--bg); color: var(--text); font: inherit;
    border: 1px solid var(--border); border-radius: 12px; padding: 11px 14px; outline: none;
    max-height: 160px; line-height: 1.45;
  }
  textarea:focus { border-color: #2c3547; }
  textarea::placeholder { color: #4d5566; }
  .send {
    background: var(--accent-dim); color: #bdf5e8; border: 1px solid rgba(94,234,212,.35);
    border-radius: 12px; padding: 11px 18px; font-weight: 600;
  }
  .send:hover { background: #17483f; color: #d9fbf3; }
  .hint { max-width: 760px; margin: 8px auto 0; font-size: 11.5px; color: #4d5566; text-align: center; }
  .empty { align-self: center; color: #4d5566; text-align: center; padding: 40px 0; }
  .empty h2 { font-weight: 600; font-size: 18px; color: var(--muted); margin-bottom: 6px; }
  #banner {
    display: none; max-width: 760px; margin: 12px auto 0; padding: 8px 12px;
    background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.3); color: var(--danger);
    border-radius: 10px; font-size: 13px;
  }
</style>
</head>
<body>
<header>
  <div class="brand">Cort<span>ex</span></div>
  <div class="spacer"></div>
  <div class="status"><span class="dot" id="dot"></span><span id="stext">offline</span></div>
  <input class="token" id="token" type="password" placeholder="Bearer token…" autocomplete="off">
  <button id="newbtn">Nuova sessione</button>
</header>

<div id="chat"><div class="inner" id="inner"></div></div>

<footer>
  <div class="bar">
    <textarea id="input" rows="1" placeholder="Scrivi un messaggio… (Invio per inviare)" disabled></textarea>
    <button class="send" id="send" disabled>Invia</button>
  </div>
  <div id="banner"></div>
  <div class="hint" id="hint">Inserisci il token (crealo con <code>uv run cortex token:create &lt;nome&gt;</code>) per iniziare.</div>
</footer>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const LS = {
  get token() { return localStorage.getItem("cortex.token") || ""; },
  set token(v) { v ? localStorage.setItem("cortex.token", v) : localStorage.removeItem("cortex.token"); },
  get session() { return localStorage.getItem("cortex.session") || ""; },
  set session(v) { v ? localStorage.setItem("cortex.session", v) : localStorage.removeItem("cortex.session"); },
};

const inner = $("inner"), input = $("input"), sendBtn = $("send"), banner = $("banner");
let busy = false;
// Streaming render state for the current assistant turn. Text runs and tool
// output interleave in DOM order: each text run is its own bubble, opened
// lazily when text arrives, and closed when a tool (or ask_user) interrupts —
// so the next text lands *below* the tools, chronologically.
let curTextEl = null;   // open assistant text bubble, or null
let curRaw = "";        // raw text accumulated into curTextEl
let curToggle = null;   // <think> toggle button for the current bubble
let curThink = null;    // <think> content block for the current bubble
let toolGroup = null;   // current tools row wrap, or null
let thinkingEl = null;  // transient "sto pensando…" indicator, or null

function setStatus(on, text) { $("dot").classList.toggle("on", on); $("stext").textContent = text; }
function showBanner(msg) { if (!msg) { banner.style.display = "none"; return; } banner.textContent = msg; banner.style.display = "block"; }
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  )).replace(/\u0000/g, "");
}

function safeUrl(u) {
  return /^(https?:|mailto:)/i.test(u) ? u : "#";
}

// Inline pass: code spans -> placeholders, then links, bold, italic, then restore spans.
function inline(s) {
  const spans = [];
  let out = s.replace(/`([^`\n]+)`/g, (m, code) => {
    const ph = "\u0000I" + spans.length + "\u0000";
    spans.push("<code>" + code + "</code>");
    return ph;
  });
  out = out.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|mailto:[^\s)]+)\)/g, (m, txt, url) => {
    const ph = "\u0000I" + spans.length + "\u0000";
    spans.push('<a href="' + safeUrl(url) + '" target="_blank" rel="noopener">' + txt + "</a>");
    return ph;
  });
  out = out.replace(/\*\*([^*<>\n]+)\*\*/g, "<strong>$1</strong>");
  out = out.replace(/\*([^*<>\n]+)\*/g, "<em>$1</em>");
  return out.replace(/\u0000I(\d+)\u0000/g, (m, n) => spans[+n]);
}

function renderMarkdown(text) {
  // Escape-first: raw input can only become HTML through escapeHtml + fixed-tag transforms.
  const esc = escapeHtml(text || "");
  // Fenced code blocks (content already escaped) -> placeholders, restored at the end.
  const blocks = [];
  const noFences = esc.replace(/^```[^\n]*\n([\s\S]*?)\n?```[ \t]*$/gm, (m, code) => {
    const ph = "\u0000B" + blocks.length + "\u0000";
    blocks.push("<pre><code>" + code.trim() + "</code></pre>");
    return ph;
  });

  const lines = noFences.split("\n");
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }

    const fencePh = /^\u0000B(\d+)\u0000\s*$/.exec(line);
    if (fencePh) { out.push(blocks[+fencePh[1]]); i++; continue; }

    const h = /^(#{1,3})\s+(.*)$/.exec(line);
    if (h) {
      const lvl = h[1].length;
      out.push("<h" + lvl + ">" + inline(h[2]) + "</h" + lvl + ">");
      i++; continue;
    }

    // Input is escaped first, so the original "> " marker now reads "&gt; ".
    if (/^&gt;\s?/.test(line)) {
      const quote = [];
      while (i < lines.length && /^&gt;\s?/.test(lines[i])) {
        quote.push(inline(lines[i].replace(/^&gt;\s?/, "")));
        i++;
      }
      out.push("<blockquote>" + quote.join("<br>") + "</blockquote>");
      continue;
    }

    if (/^[-*]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^[-*]\s+/.test(lines[i])) {
        items.push("<li>" + inline(lines[i].replace(/^[-*]\s+/, "")) + "</li>");
        i++;
      }
      out.push("<ul>" + items.join("") + "</ul>");
      continue;
    }

    if (/^\d+\.\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\d+\.\s+/.test(lines[i])) {
        items.push("<li>" + inline(lines[i].replace(/^\d+\.\s+/, "")) + "</li>");
        i++;
      }
      out.push("<ol>" + items.join("") + "</ol>");
      continue;
    }

    // Paragraph: consecutive lines until blank line, placeholder, or a new block start;
    // single newlines become <br>.
    const para = [];
    while (
      i < lines.length &&
      lines[i].trim() &&
      !/^\u0000B\d+\u0000\s*$/.test(lines[i]) &&
      !/^(#{1,3})\s+/.test(lines[i]) &&
      !/^&gt;\s?/.test(lines[i]) &&
      !/^[-*]\s+/.test(lines[i]) &&
      !/^\d+\.\s+/.test(lines[i])
    ) {
      para.push(inline(lines[i]));
      i++;
    }
    out.push("<p>" + para.join("<br>") + "</p>");
  }

  return out.join("").replace(/\u0000B(\d+)\u0000/g, (m, n) => blocks[+n]);
}

function extractThink(text) {
  const parts = [];
  let clean = text.replace(/<think>([\s\S]*?)<\/think>/g, (_, c) => { parts.push(c); return ""; });
  clean = clean.replace(/<think>([\s\S]*)$/, (_, c) => { parts.push(c); return ""; });
  return { clean: clean.replace(/^\s+/, ""), think: parts.join("\n\n") };
}

// Text-segment lifecycle: open a fresh assistant bubble lazily, close it so a
// following tool round (or the next text run) lands below it in DOM order.
function openText() {
  if (curTextEl) return curTextEl;
  curTextEl = addMsg("assistant", "");
  curRaw = ""; curToggle = null; curThink = null;
  toolGroup = null;  // tools after this text start a new row below it
  return curTextEl;
}
function closeText() { curTextEl = null; }

// Render the current segment's raw text, splitting off any <think> block into a
// collapsible toggle attached to the current bubble.
function renderCurrent() {
  const { clean, think } = extractThink(curRaw);
  if (think) { ensureThink(); curThink.textContent = think; }
  curTextEl.dataset.raw = clean;
  curTextEl.innerHTML = renderMarkdown(clean);
}

function ensureThink() {
  if (curToggle) return;
  curToggle = document.createElement("button");
  curToggle.className = "think-toggle";
  curToggle.textContent = "▸ mostra ragionamento";
  curThink = document.createElement("div");
  curThink.className = "think-block";
  curTextEl.after(curToggle);
  curToggle.after(curThink);
  curToggle.addEventListener("click", () => {
    const vis = curThink.classList.toggle("visible");
    curToggle.textContent = (vis ? "▾ nascondi" : "▸ mostra") + " ragionamento";
  });
}

function dropThinking() { if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; } }

function addMsg(cls, text) {
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.textContent = text;
  inner.appendChild(el);
  scroll();
  return el;
}
function scroll() { $("chat").scrollTop = $("chat").scrollHeight; }

function addThinking() {
  const el = document.createElement("div");
  el.className = "thinking";
  el.innerHTML = '<span class="tick"><i></i><i></i><i></i></span> <span>sto pensando…</span>';
  inner.appendChild(el); scroll();
  return el;
}

function addTool(name, ok, out) {
  const chip = document.createElement("span");
  chip.className = "tool " + (ok ? "ok" : "fail");
  chip.textContent = (ok ? "✓ " : "✗ ") + name;
  if (out) {
    chip.classList.add("expandable");
    chip.classList.add("expanded");  // output visible by default; click to collapse
    const pre = document.createElement("pre");
    pre.textContent = out;
    chip.appendChild(pre);
    chip.addEventListener("click", () => chip.classList.toggle("expanded"));
  }
  // Consecutive tool results (same iteration) share a row; a text run in
  // between resets toolGroup, so the next round opens a fresh row below it.
  if (!toolGroup) { toolGroup = document.createElement("div"); toolGroup.className = "tools"; inner.appendChild(toolGroup); }
  toolGroup.appendChild(chip);
  scroll();
}

function renderOptions(options) {
  const wrap = document.createElement("div");
  wrap.className = "options";
  for (const opt of options) {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = opt;
    btn.addEventListener("click", () => {
      if (busy) return;              // wait until the turn finished
      wrap.remove();                 // consume the choices once one is picked
      input.value = opt;
      send();
    });
    wrap.appendChild(btn);
  }
  inner.appendChild(wrap);
  scroll();
}

function renderHistory(messages) {
  for (const m of messages) {
    if (m.role === "user") addMsg("user", m.content);
    else if (m.role === "assistant" && m.content) {
      const el = addMsg("assistant", "");
      el.innerHTML = renderMarkdown(m.content);
    }
  }
}

function handleFrame(frame, onDone) {
  const ev = /^event: (.*)$/m.exec(frame)?.[1];
  const dl = frame.split("\n").find((l) => l.startsWith("data: "));
  if (!ev || !dl) return;
  let data; try { data = JSON.parse(dl.slice(6)); } catch { return; }
  switch (ev) {
    case "thinking":
      if (thinkingEl) thinkingEl.textContent = data.message || "sto pensando…";
      break;
    case "text":
      dropThinking();
      openText();                       // lazily create the bubble (below any tools)
      curTextEl.classList.add("streaming");
      curRaw += data.delta || "";
      renderCurrent();
      scroll();
      break;
    case "tool_start":
      dropThinking();
      closeText();                      // next text run opens a fresh bubble below
      break;
    case "tool_done":
      dropThinking();
      closeText();
      addTool(data.tool_name, !!data.success, data.output || data.error || "");
      break;
    case "ask_user":
      dropThinking();
      closeText();
      openText();                       // question in its own bubble, below tools
      curRaw = data.question || "";
      renderCurrent();
      if (Array.isArray(data.options) && data.options.length) {
        renderOptions(data.options);    // separate sibling; survives re-render
      }
      closeText();
      scroll();
      break;
    case "done":
      if (curTextEl) {
        curTextEl.classList.remove("streaming");
        renderCurrent();
      } else if (data.final_message) {
        // No text streamed this turn — render the final message as a bubble.
        openText();
        curRaw = data.final_message;
        renderCurrent();
      }
      closeText();
      onDone();
      break;
    case "error":
      dropThinking();
      if (curTextEl && !curTextEl.dataset.raw && !curTextEl.textContent) curTextEl.remove();
      closeText();
      addMsg("error", data.error || "Errore sconosciuto");
      onDone();
      break;
  }
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + LS.token, ...(opts.headers || {}) },
  });
  if (!res.ok) {
    let detail = res.statusText;
    try { const j = await res.json(); detail = (j.detail && (j.detail.detail || j.detail.error)) || JSON.stringify(j.detail || j); } catch {}
    const err = new Error(detail);
    err.status = res.status;
    throw err;
  }
  return res;
}

async function ensureSession() {
  if (LS.session) { try { await api("/sessions/" + LS.session); return; } catch (e) { if (e.status !== 404) throw e; } }
  const res = await api("/sessions", { method: "POST" });
  const s = await res.json();
  LS.session = s.id;
}

async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  showBanner("");
  input.value = ""; autoSize();
  addMsg("user", text);
  // Reset the streaming render state for this turn; bubbles are created lazily.
  curTextEl = null; curRaw = ""; curToggle = null; curThink = null; toolGroup = null;
  thinkingEl = addThinking();
  busy = true; setBusy(true);

  try {
    await ensureSession();
    const res = await api("/chat/stream", {
      method: "POST",
      body: JSON.stringify({ message: text, session_id: LS.session || null }),
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        handleFrame(buf.slice(0, idx), () => {});
        buf = buf.slice(idx + 2);
      }
    }
    dropThinking();
    if (curTextEl && !curTextEl.dataset.raw && !curTextEl.textContent) curTextEl.remove();
  } catch (e) {
    dropThinking();
    if (curTextEl && !curTextEl.dataset.raw && !curTextEl.textContent) curTextEl.remove();
    if (e.status === 404) { LS.session = ""; addMsg("error", "Sessione scaduta — riprova."); }
    else addMsg("error", String(e.message || e));
  } finally {
    busy = false; setBusy(false);
  }
}

function setBusy(b) { sendBtn.disabled = b || !LS.token; input.disabled = b; }

function autoSize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; }

async function init() {
  $("token").value = LS.token;
  input.placeholder = LS.token ? "Scrivi un messaggio… (Invio per inviare)" : "Inserisci il token qui sopra per iniziare";
  setBusy(false);
  if (!LS.token) return;

  // Health check
  try {
    const r = await fetch("/health");
    const h = await r.json();
    const ok = h.components && h.components.database && h.components.database.status === "healthy";
    setStatus(ok, ok ? "connesso" : "health: " + JSON.stringify(h.components));
  } catch { setStatus(false, "API non raggiungibile"); }

  // Restore history
  if (LS.session) {
    try {
      const r = await api("/sessions/" + LS.session);
      const s = await r.json();
      if (s.messages && s.messages.length) { $("empty") && $("empty").remove(); renderHistory(s.messages); }
    } catch { LS.session = ""; }
  }
  if (!inner.children.length) showEmpty();
}

function showEmpty() {
  const el = document.createElement("div");
  el.className = "empty"; el.id = "empty";
  el.innerHTML = "<h2>Ciao</h2>Chiedi qualcosa — Cortex ha memoria, strumenti e un loop agentico.";
  inner.appendChild(el);
}

$("token").addEventListener("input", (e) => { LS.token = e.target.value.trim(); setBusy(false); });
$("newbtn").addEventListener("click", async () => {
  showBanner("");
  inner.innerHTML = "";
  LS.session = "";
  if (LS.token) {
    try { await ensureSession(); } catch (e) { showBanner(String(e.message || e)); }
  }
  showEmpty();
});
$("send").addEventListener("click", send);
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
input.addEventListener("input", autoSize);
init();
</script>
</body>
</html>

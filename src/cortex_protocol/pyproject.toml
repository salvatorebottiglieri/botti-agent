[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cortex-protocol"
version = "0.1.0"
description = "Language-agnostic protocol for Cortex minions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["cortex_protocol"]

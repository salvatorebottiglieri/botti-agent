repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        name: ruff (lint)
        args: [src, tests]
        files: ^(src|tests)/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.2
    hooks:
      - id: mypy
        name: mypy (typecheck)
        args: [src]
        pass_filenames: false
        additional_dependencies:
          - pydantic>=2.0
          - pydantic-settings>=2.0
          - asyncpg>=0.29
          - openai>=1.0
          - aiomqtt>=2.0
          - pyyaml>=6.0
          - structlog>=24.0
          - tenacity>=8.0
          - fastapi>=0.115
          - httpx>=0.27
          - typer>=0.15
          - uvicorn>=0.30
          - numpy>=2.5.2
          - types-PyYAML
          - types-colorama
